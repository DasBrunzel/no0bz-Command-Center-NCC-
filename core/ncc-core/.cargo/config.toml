[target.x86_64-pc-windows-msvc]
# ed25519-dalek's verification path needs more than the Windows executable
# default main-thread stack on current MSVC toolchains.  Service binaries must
# not crash while validating an otherwise valid signed release.
# A static CRT keeps the Core runnable on clean Windows installs without the
# Visual C++ Redistributable (VCRUNTIME140.dll).
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "target-feature=+crt-static"]
