[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "no0bz-command-center"
version = "0.5.0a1"
description = "Self-hosted monitoring server and cross-platform telemetry agent"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "psutil>=6,<8", "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1", "nvidia-ml-py>=12.560,<13",
  "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4"
]

[project.scripts]
ncc-server = "ncc_server.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "types-psutil>=6"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ncc"]
mypy_path = "backend"

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]

