name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install -e .[dev]
      - run: ruff check backend tests scripts
      - run: mypy
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm run lint
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ncc
          POSTGRES_USER: ncc
          POSTGRES_PASSWORD: ncc-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ncc -d ncc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NCC_SERVER_DATABASE_URL: postgresql+psycopg://ncc:ncc-ci-password@127.0.0.1:5432/ncc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .[dev]
      - run: alembic upgrade head
      - run: alembic current
      - run: pytest -q tests/test_server_foundation.py tests/test_server_devices.py
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
  service-packaging:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Linux service scripts
        if: runner.os == 'Linux'
        run: sh -n scripts/install_ncc_agent_service.sh scripts/install_ncc_server_service.sh scripts/uninstall_ncc_service.sh scripts/install_ncc_agent_tailscale_service.sh scripts/install_ncc_server_tailscale_service.sh
      - name: Validate Windows service scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem scripts -Filter '*ncc*service.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            $parseErrors += $errors
          }
          if ($parseErrors.Count) {
            $parseErrors | Format-List
            exit 1
          }
  windows-agent-installer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build self-contained NCC Agent setup
        shell: powershell
        run: .\scripts\build_ncc_agent_setup.ps1
      - name: Fresh install, reinstall, and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Resolve-Path 'dist\installer\ncc-agent-setup-0.6.0-beta.8-dev.1-windows-x86_64.exe'
          $args = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SERVERURL=http://127.0.0.1:8350')
          & $setup @args
          if ($LASTEXITCODE -ne 0) { throw "Fresh install failed: $LASTEXITCODE" }
          if ((Get-Service NccAgentCore).Status -ne 'Running') { throw 'Agent service did not start' }
          $root = Join-Path $env:ProgramData 'no0bz\NCC Agent'
          $data = Join-Path $root 'data\machine-id'
          if (-not (Test-Path $data)) { throw 'Agent identity was not created' }
          $identity = Get-Content $data -Raw
          & $setup @args
          if ($LASTEXITCODE -ne 0) { throw "Reinstall failed: $LASTEXITCODE" }
          if ((Get-Service NccAgentCore).Status -ne 'Running') { throw 'Agent service did not survive reinstall' }
          if ((Get-Content $data -Raw) -ne $identity) { throw 'Agent identity changed during reinstall' }
          $uninstall = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object DisplayName -eq 'no0bz Command Center Agent' | Select-Object -First 1
          if (-not $uninstall -or $uninstall.UninstallString -notmatch '^"([^"]+)"') {
            throw 'Apps and Features uninstaller not registered'
          }
          & $Matches[1] /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstall failed: $LASTEXITCODE" }
          Start-Sleep -Seconds 3
          if (Get-Service NccAgentCore -ErrorAction SilentlyContinue) { throw 'Agent service remains after uninstall' }
          if (Test-Path $root) { throw 'Agent data remains after uninstall' }

